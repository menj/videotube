name: PHP compatibility
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, pdo_sqlite
          tools: composer:v2
          coverage: none
      - run: composer validate --no-check-publish
      - run: composer install --no-interaction --no-progress
      - run: composer check-platform-reqs
      - name: Lint every PHP file
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Regression tests (warnings and deprecations fail)
        run: composer test
  reject-old-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Reject PHP below 8.4 before connecting to a database
        run: |
          output=$(php -r 'require "includes/config.php"; echo "BOOTSTRAP_CONTINUED";')
          test "$output" = "VideoTube requires PHP 8.4 or newer."
